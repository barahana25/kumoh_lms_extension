<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>금오 LMS 스토어 이미지</title>
  <!-- 1280x800 스토어 이미지. 팝업은 iframe으로 실제 크기(400x600) 그대로 띄워
       줄이거나 늘리지 않는다. 그래야 글자가 흐려지지 않는다. -->
  <style>
    :root {
      --bg-top: #ecf6fa; --bg-bottom: #d6ecf4;
      --glow: rgba(0, 169, 206, .28);
      --title: #121c21; --desc: #48565e;
      --tag-bg: #006780; --tag-fg: #ffffff;
      --shadow: 0 18px 50px rgba(16, 40, 52, .22), 0 2px 8px rgba(16, 40, 52, .10);
    }
    .dark {
      --bg-top: #121a1f; --bg-bottom: #080e12;
      --glow: rgba(0, 169, 206, .22);
      --title: #ecf2f5; --desc: #a0b0b8;
      --tag-bg: #5fd4fd; --tag-fg: #08141a;
      --shadow: 0 18px 50px rgba(0, 0, 0, .6), 0 2px 8px rgba(0, 0, 0, .4);
    }
    html, body { margin: 0; }
    body {
      width: 1280px; height: 800px; overflow: hidden; position: relative;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    .glow {
      position: absolute; left: 700px; top: 120px; width: 500px; height: 500px;
      border-radius: 50%; background: var(--glow); filter: blur(90px);
    }
    .copy {
      position: absolute; left: 130px; top: 50%; transform: translateY(-50%); width: 540px;
    }
    .tag {
      display: inline-block; padding: 10px 20px; border-radius: 999px;
      background: var(--tag-bg); color: var(--tag-fg); font-size: 20px; font-weight: 700;
    }
    h1 {
      margin: 36px 0 28px; font-size: 54px; line-height: 1.3; font-weight: 800;
      color: var(--title); letter-spacing: -1px; white-space: pre-line;
    }
    p { margin: 0; font-size: 24px; line-height: 1.55; color: var(--desc); white-space: pre-line; }
    .popup {
      position: absolute; left: 740px; top: 100px; width: 400px; height: 600px;
      border: 0; border-radius: 20px; box-shadow: var(--shadow); background: transparent;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <span class="tag">금오 LMS 알리미</span>
    <h1 id="title"></h1>
    <p id="desc"></p>
  </div>
  <iframe class="popup" id="popup" scrolling="no"></iframe>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("title").textContent = q.get("title") || "";
    document.getElementById("desc").textContent = q.get("desc") || "";
    if (q.get("dark") === "1") document.body.classList.add("dark");
    document.getElementById("popup").src = `preview.html?scene=${encodeURIComponent(q.get("scene") || "courses")}`;
  </script>
</body>
</html>
